name: Check weather UI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check assets/weather-app.js
      - run: node --check assets/weather-core.js
      - run: node --test tests/*.test.cjs
      - run: python -m py_compile weather.py
