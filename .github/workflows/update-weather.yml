name: Update Heartopia Weather

on:
  push:
    branches: [main]
    paths:
      - weather.py
      - .github/workflows/update-weather.yml
  workflow_dispatch:
  pull_request:
    paths:
      - weather.py
      - data/weather-*.json
      - assets/weather-core.js
      - assets/weather-visual.js
      - assets/weather-app.js
      - tests/test_calendar_weather.py
      - .github/workflows/update-weather.yml

jobs:
  update-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test calendar and missing-data behavior
        run: python -m unittest discover -s tests -p 'test_calendar_weather.py' -v

      - name: Get Heartopia weather
        run: python weather.py

      - name: Verify 9 calendar days and fresh date
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          data = json.load(open("weather.json", encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          expected = now.date()
          actual = [day["startDate"] for day in data["days"]]
          assert len(actual) == 9, f"Expected 9 game days, got {len(actual)}"
          assert actual[0] == expected.isoformat(), f"Stale start date: {actual[0]}, expected {expected}"
          assert actual == [(expected + timedelta(days=i)).isoformat() for i in range(9)], f"Nonconsecutive dates: {actual}"
          print(f"Verified 9 game days from {actual[0]} through {actual[-1]}")
          PY

      - name: Save weather.json
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "Update Heartopia weather"
          git push
