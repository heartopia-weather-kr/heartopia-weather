name: Update Heartopia Weather

on:
  push:
    branches: [main]
    paths:
      - weather.py
      - .github/workflows/update-weather.yml
  workflow_dispatch:
  schedule:
    # Two off-peak attempts per hour reduce gaps when GitHub skips/delays scheduled runs.
    # GitHub schedules are best-effort, not guaranteed.
    - cron: "13,43 * * * *"

jobs:
  update-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Get Heartopia weather
        run: python weather.py

      - name: Verify 9 game days and fresh date
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          data = json.load(open("weather.json", encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          expected = (now - timedelta(days=1) if now.hour < 6 else now).date()
          actual = [day["startDate"] for day in data["days"]]
          assert len(actual) == 9, f"Expected 9 game days, got {len(actual)}"
          assert actual[0] == expected.isoformat(), f"Stale start date: {actual[0]}, expected {expected}"
          assert actual == [(expected + timedelta(days=i)).isoformat() for i in range(9)], f"Nonconsecutive dates: {actual}"
          print(f"Verified 9 game days from {actual[0]} through {actual[-1]}")
          PY

      - name: Save weather.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "Update Heartopia weather"
          git push
