<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두근두근타운 날씨 시계 · 개발 미리보기</title>
<style>

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at top,#30325c,#10162c 70%);color:#f6f4ff}
main{max-width:1000px;margin:auto;padding:22px 14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(22px,4vw,30px);margin:4px 0}
p{color:#c2c5e3;font-size:13px}
.eyebrow{letter-spacing:.15em;color:#c4b7ff;font-size:11px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid #afa0e888;border-radius:30px;padding:10px 14px;background:#ffffff15;color:inherit}
.btn:focus-visible,.slot:focus-visible{outline:3px solid #ffca83;outline-offset:3px}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:20px}
.card{border:1px solid #a8a2e53b;background:#ffffff0b;border-radius:24px;padding:18px}
.card h2{font-size:18px;margin:0}
.clock{width:min(100%,490px);aspect-ratio:1;margin:20px auto;position:relative;border-radius:50%;border:2px solid #a99af566;background:radial-gradient(circle,#2b315b,#171e3e 72%);box-shadow:0 0 32px #9784f62b,inset 0 0 24px #7c6bd02a}
.slot{position:absolute;transform:translate(-50%,-50%);width:16%;aspect-ratio:1;border-radius:50%;background:#273156;border:2px solid #ffffff44;color:white;display:grid;place-content:center;text-align:center;padding:0;line-height:1.2}
.slot span{font-size:clamp(17px,3vw,26px)}
.slot small{font-size:10px;color:#c5c8e6}
.slot.changed{border-color:#ffa862;box-shadow:0 0 10px #ff993c8c}
.slot.special{border-color:#c083ff;box-shadow:0 0 11px #b174ffae}
.slot.both{border-color:#ffa862;box-shadow:0 0 0 3px #a872ff8c,0 0 12px #ff993c8c}
.slot.selected{outline:3px solid #ded0ff;outline-offset:3px}
.center{position:absolute;inset:31%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at top,#474a80,#232b4f);border:1px solid #b5a5ff7a;pointer-events:none;text-align:center}
.hero{font-size:clamp(30px,7vw,57px)}
.name{font-size:clamp(14px,3vw,22px);font-weight:800}
.time{font-size:11px;color:#d3c9ff}
.hand{position:absolute;left:50%;top:25%;height:25%;width:2px;background:linear-gradient(#e9d9ff,#8978e7);transform-origin:bottom center;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#c5c8e4}
.legend b{font-weight:400}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.list{display:grid;gap:8px;margin-top:16px}
.item{display:flex;justify-content:space-between;align-items:center;border:1px solid #ffffff20;background:#ffffff08;padding:11px 12px;border-radius:12px;font-size:14px}
.note{line-height:1.7;margin-top:18px}
.light{background:#eef2ff;color:#27365a}
.light .card{background:#fff;border-color:#cbd5f1}
.light p,.light .note{color:#586780}
.light .btn{color:#25365a;border-color:#9daed2}
.light .legend{color:#516280}
@media(max-width:740px){.layout{grid-template-columns:1fr}
.card{padding:15px}
.clock{max-width:430px}
.slot{width:17%}
}
 
</style>
</head>
<body>
<main>
<header>
<div>
<div class="eyebrow">HEARTOPIA WEATHER · DEVELOPMENT</div>
<h1>🌙 두근두근타운 날씨 시계</h1>
<p>12시 상단 · 한국시간 · 갤럭시 탭 대응</p>
</div>
<div>
<button class="btn" id="mode">🌙 밤 보기</button> <button class="btn" id="theme">☀️ 라이트</button>
</div>
</header>
<div class="layout">
<section class="card">
<h2>시간별 날씨</h2>
<p>날씨 아이콘을 누르면 해당 시간으로 이동해요.</p>
<div class="clock" id="clock">
<div class="hand" id="hand">
</div>
<div class="center">
<div class="hero" id="hero">
</div>
<div class="name" id="name">
</div>
<div class="time" id="time">
</div>
</div>
</div>
<div class="legend">
<b>
<i style="background:#ffa862">
</i>변경</b>
<b>
<i style="background:#c083ff">
</i>특수</b>
<b>
<i style="background:linear-gradient(90deg,#ffa862 50%,#c083ff 50%)">
</i>동시</b>
<b>
<i style="background:#ded0ff">
</i>선택</b>
</div>
<p style="text-align:center">
<button class="btn" id="reset">↩ 현재 시간으로 복귀</button>
</p>
</section>
<aside class="card">
<h2>12시간 예보</h2>
<p id="label">
</p>
<div class="list" id="list">
</div>
<p class="note">현재는 <strong>디자인·기능 확인용 예시 날씨</strong>입니다. 실제 게임 날씨 연동 전이며, 기존 날씨 사이트는 변경하지 않았습니다. 아이콘도 추후 확정된 PNG로 교체합니다.</p>
</aside>
</div>
</main>
<script>

const kinds=[['맑음','☀️'],['쾌청','🌤️'],['흐림','☁️'],['여우비','🌦️'],['약한 비','🌧️'],['보통 비','🌧️'],['강한 비','⛈️'],['달빛 비','🌧️'],['약한 눈','🌨️'],['보통 눈','❄️'],['강한 눈','🌨️'],['무지개','🌈',1],['달 무지개','🌙',1],['유성우 1','🌠',1],['유성우 2','🌠',1],['유성우 3','🌠',1],['오로라 1','✨',1],['오로라 2','✨',1],['오로라 3','✨',1],['폭염','🌞'],['꽃잎 비','🌸']];
const pattern=[0,0,1,2,2,3,0,1,2,4,5,5,11,0,2,6,6,20,12,13,14,16,2,7];
const changed=new Set([6,9,12,16,18,21]);
const $=id=>document.getElementById(id),kst=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
let night=kst().getHours()<6||kst().getHours()>=18,selected=null,light=false;
function draw(){const n=kst(),current=n.getHours(),hour=selected??current,w=kinds[pattern[hour]],hours=Array.from({length:12},(_,i)=>((night?18:6)+i)%24);
$('hero').textContent=w[1];
$('name').textContent=w[0];
$('time').textContent=String(hour).padStart(2,'0')+':00'+(selected===null?' · 현재':' · 선택');
$('mode').textContent=night?'☀️ 낮 보기':'🌙 밤 보기';
$('theme').textContent=light?'🌙 미드나잇':'☀️ 라이트';
document.body.classList.toggle('light',light);
document.querySelectorAll('.slot').forEach(e=>e.remove());
hours.forEach((h,i)=>{const k=kinds[pattern[h]],a=i*Math.PI/6,b=document.createElement('button');
b.className='slot'+(changed.has(h)&&k[2]?' both':changed.has(h)?' changed':k[2]?' special':'')+(hour===h?' selected':'');
b.style.left=50+41*Math.sin(a)+'%';
b.style.top=50-41*Math.cos(a)+'%';
b.setAttribute('aria-label',h+'시 '+k[0]);
b.innerHTML='<span>'+k[1]+'</span>
<small>'+String(h).padStart(2,'0')+'시</small>';
b.onclick=()=>{selected=h;
draw()};
$('clock').appendChild(b)});
$('hand').style.transform='translateX(-50%) rotate('+((current%12)*30+n.getMinutes()*.5)+'deg)';
$('label').textContent=night?'밤 18:00–05:59':'낮 06:00–17:59';
$('list').innerHTML=hours.map(h=>{const k=kinds[pattern[h]];
return '<div class="item">
<strong>'+String(h).padStart(2,'0')+':00</strong>
<span>'+k[1]+' '+k[0]+'</span>
<span>'+(changed.has(h)?'🟠':'')+(k[2]?'🟣':'')+'</span>
</div>'}).join('')} $('mode').onclick=()=>{night=!night;
selected=null;
draw()};
$('theme').onclick=()=>{light=!light;
draw()};
$('reset').onclick=()=>{selected=null;
night=kst().getHours()<6||kst().getHours()>=18;
draw()};
let sx=null;
$('clock').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('clock').addEventListener('touchend',e=>{if(sx!==null&&Math.abs(e.changedTouches[0].clientX-sx)>70){night=!night;
selected=null;
draw()}sx=null},{passive:true});
draw();
setInterval(()=>{if(selected===null)night=kst().getHours()<6||kst().getHours()>=18;
draw()},30000);


</script>
</body>
</html>
